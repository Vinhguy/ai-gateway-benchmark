[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gateway-benchmark-client"
version = "0.1.0"
description = "Direct asynchronous HTTP load generator for AI gateway benchmarks"
requires-python = ">=3.12,<3.13"
dependencies = ["aiohttp==3.12.15"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
