model_list:
  - model_name: openai/gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_base: http://mocker:8000/v1
      api_key: benchmark-mock-key
      num_retries: 0

litellm_settings:
  num_retries: 0
  set_verbose: false
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
